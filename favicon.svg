<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="WindMe">
  <defs>
    <linearGradient id="wm-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3aa0ff"/>
      <stop offset="0.55" stop-color="#22b8e6"/>
      <stop offset="1" stop-color="#1fd0a3"/>
    </linearGradient>
    <linearGradient id="wm-needle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e6f6ff"/>
    </linearGradient>
    <radialGradient id="wm-gloss" cx="0.5" cy="0.28" r="0.75">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="64" height="64" rx="16" fill="url(#wm-bg)"/>
  <rect width="64" height="64" rx="16" fill="url(#wm-gloss)"/>

  <!-- циферблат -->
  <circle cx="32" cy="32" r="20.5" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1.5"/>
  <g stroke="#ffffff" stroke-opacity="0.5" stroke-width="2" stroke-linecap="round">
    <line x1="32" y1="13.5" x2="32" y2="17.5"/>
    <line x1="32" y1="46.5" x2="32" y2="50.5"/>
    <line x1="13.5" y1="32" x2="17.5" y2="32"/>
    <line x1="46.5" y1="32" x2="50.5" y2="32"/>
  </g>

  <!-- стрілка-голка (напрямок вітру) -->
  <g transform="rotate(45 32 32)">
    <polygon points="32,12.5 26.4,33 37.6,33" fill="url(#wm-needle)"/>
    <polygon points="32,51.5 26.4,31 37.6,31" fill="#ffffff" fill-opacity="0.45"/>
  </g>

  <!-- центральний ковпачок -->
  <circle cx="32" cy="32" r="4.7" fill="#0b2f3a"/>
  <circle cx="32" cy="32" r="4.7" fill="none" stroke="#ffffff" stroke-opacity="0.85" stroke-width="1.4"/>
  <circle cx="30.4" cy="30.4" r="1.4" fill="#ffffff" fill-opacity="0.9"/>
</svg>
